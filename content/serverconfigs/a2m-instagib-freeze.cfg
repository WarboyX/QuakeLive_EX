// a2m-instagib-freeze.cfg - instagib freeze tag. Railgun only; a hit freezes
// rather than kills, and a team-mate standing over you thaws you out.
//   quakelive_dedicated +set dedicated 2 +exec a2m-instagib-freeze.cfg +map <map>
exec a2m-common.cfg

set sv_hostname         "A2M | Instagib Freeze Tag"
set g_gametype          "9"
set g_startingWeapons   "64"    // railgun only
set timelimit           "20"
set roundlimit          "0"
set sv_maxclients       "16"
set g_teamAutoJoin      "1"
set g_teamForceBalance  "1"
