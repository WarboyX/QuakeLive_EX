// net_test.cfg - 50 tick and an unclamped rate, as an experiment
//
//   exec net_test.cfg
//
// sv_fps takes effect immediately now - SV_SendClientMessages derives the
// snapshot interval per frame rather than caching it at connect time, so a
// running match picks the new tick up on the next frame. It used to need a
// map_restart, and a test without one measured the old tick and looked like the
// change had done nothing.
//
// This does NOT exec common.cfg. Exec it after whichever mode config you are
// running, or the mode reset will put sv_fps back to 40 underneath you.
//
// To go back: exec net_stock.cfg.

// ---------------------------------------------------------------------------
// The tick
// ---------------------------------------------------------------------------
//
// 50, because 1000/sv_fps is integer division and 50 is one of the few values
// that comes out exact - 20ms, no error. 60 gives 16ms, which is 62.5Hz rather
// than 60; 66 gives 15ms, which is 66.67Hz.
//
// 50 is also the fastest tick where the default lag compensation still covers
// its own rewind window. g_lagHaxHistory is 4 frames and g_lagHaxMs is 80ms:
//
//   40 tick -> 4 x 25ms = 100ms of history, covers 80ms
//   50 tick -> 4 x 20ms =  80ms of history, covers 80ms exactly
//   62 tick -> 4 x 16ms =  64ms of history, SHORT
//   66 tick -> 4 x 15ms =  60ms of history, SHORT
//
// HAX_Replay clamps at the oldest slot rather than failing, so above 50 the
// compensation silently gets weaker instead of erroring - a shot that should
// have hit a strafing target starts missing, and nothing says why. Anything
// past 50 needs g_lagHaxHistory raised with it.
//
// Costs against 40: a quarter more game frames, and 34 Mbit/s of upstream at 64
// players instead of 27. Bot AI does not scale with this - bots think on their
// own bot_thinktime timer - so the expensive half is insulated.
set sv_fps              "50"

// ---------------------------------------------------------------------------
// The rate clamp
// ---------------------------------------------------------------------------
//
// This is the part that has actually been limiting delivery. SV_RateMsec allows
// one snapshot per (message + 28) * 1000 / rate milliseconds, so against the
// 1308-byte peak measured at 64 players on thunderstruck:
//
//   rate  25000 -> 53ms -> 18.9 snapshots a second
//   rate  50000 -> 26ms -> 37.4
//   rate  90000 -> 14ms -> 71.4
//
// 90000 rather than the 66800 the arithmetic asks for, because the send test is
// "elapsed > rateMsec", strictly greater. Land exactly on the frame interval and
// a frame that arrives at 20ms against a rateMsec of 20 is held back, so you get
// 25 a second instead of 50 - the boundary halves it. 90000 leaves 6ms of slack
// for jitter and for snapshots larger than the one peak we happened to record.
//
// Over-provisioning costs nothing. rate is a ceiling, not an allocation: the
// server sends one snapshot per tick and rate only decides whether it is allowed
// to. Real traffic is 534 kbit/s per client either way.
//
// sv_minRate rather than asking players to set rate, because it applies to
// everyone - including a client that sends no rate at all, which lands on the
// 8000 default and receives six snapshots a second no matter how fast the server
// runs. A stock Quake Live player who has never opened a config is on that path.
set sv_minRate          "90000"

// No ceiling. A client that has set a high rate itself should keep it.
set sv_maxRate          "0"

// ---------------------------------------------------------------------------
// What to look at afterwards
// ---------------------------------------------------------------------------
//
// snapstats, or the map report if sv_mapEndReport is on. The line that matters:
//
//   snapshots sent N, held back by rate M
//
// M near zero means the wire has stopped being the limit and the tick is now
// what decides delivery - which is the point of this file. M still large means
// the snapshot is bigger than the peak this was sized against, and the rate
// needs to go up rather than the tick.
//
// On a listen server "held back by rate 0" is not evidence: loopback clients and
// bots skip rate control entirely, so the number only means something for a real
// remote client.
