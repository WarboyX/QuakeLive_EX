// common.cfg - shared settings, exec'd first by every config in this folder.
//
// Anything here is a starting point, not a rule. Override it after the exec
// line in whichever config you are actually running.

set sv_maxclients       "16"
set sv_pure             "1"
set sv_floodProtect     "1"

// Empty until you have a master to point at - see server.cfg.example.
set sv_master1          ""

// Drop connecting players straight into the match. Duel keeps its play queue
// either way.
set g_autoJoin          "1"

set g_allowVote         "1"
set g_inactivity        "0"
set g_log               "games.log"

set bot_enable          "1"
set g_spSkill           "3"
