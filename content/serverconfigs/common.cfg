// common.cfg - baseline, exec'd first by every config in this folder.
//
// This file exists to make the configs here *switchable*. A config only sets
// what it cares about, so exec'ing ffa.cfg after a2m-instagib.cfg used to
// leave instagib, the single-weapon lockout and the suppressed item spawns
// still in force - ffa.cfg never mentions them, so nothing put them back.
// Modes silently inherited each other and you got a "FFA" server with no
// weapons on the floor.
//
// So the rule for this folder is:
//
//   every cvar that ANY config here sets must be reset to its stock default
//   below, whether or not this file otherwise cares about it.
//
// Add a mode that touches a new cvar? Add it to the reset block too, or the
// next person to switch away from your mode inherits it.
//
// Note that g_gametype and sv_maxclients are latched: exec'ing a config at
// runtime will not apply them until the next map load. Starting the server as
//   +exec <mode>.cfg +map <map>
// avoids that entirely. Switching modes on a running server needs a map
// command afterwards, not just the exec.

// ===========================================================================
// reset to stock - values are the engine/game defaults, taken from g_main.c
// ===========================================================================

// instagib and its knock-on effects
set g_instaGib          "0"
set g_infiniteAmmo      "0"

// item spawning
set g_spawnItemWeapons  "1"
set g_spawnItemAmmo     "1"
set g_spawnItemArmor    "1"
set g_spawnItemHealth   "1"
set g_spawnItemPowerup  "1"
set g_spawnItemHoldable "1"
set g_weaponRespawn     "5"

// what players spawn with
set g_startingWeapons       "3"
set g_startingHealth        "100"
set g_startingHealthBonus   "25"
set g_startingArmor         "0"

// loadout
set g_loadout           "0"
set g_disableLoadout    "0"

// scoring limits - a mode that does not set one still gets a sane value
set fraglimit           "20"
set timelimit           "0"
set capturelimit        "8"
set roundlimit          "10"

// teams
set g_teamAutoJoin      "0"
set g_teamForceBalance  "1"

// misc gameplay
set g_gauntletSpeedFactor   "1.0"

// ===========================================================================
// shared defaults - a starting point, override after the exec in your config
// ===========================================================================

set sv_maxclients       "16"
set sv_pure             "1"
set sv_floodProtect     "1"

// Empty until you have a master to point at - see server.cfg.example.
set sv_master1          ""

// Drop connecting players straight into the match. Duel keeps its play queue
// either way.
set g_autoJoin          "1"

set g_allowVote         "1"
set g_inactivity        "0"
set g_log               "games.log"

set bot_enable          "1"
set g_spSkill           "3"

// ===========================================================================
// end-of-match arena vote
// ===========================================================================
//
// At intermission the match summary offers three arenas to vote on, and the
// winner loads next. "nextmaps" is what chooses them - an infostring of
// map_0..map_2 with optional title_N (the label shown under the level shot)
// and cfg_N (a config exec'd with the map):
//
//   set nextmaps "\map_0\campgrounds\title_0\Campgrounds\map_1\bloodrun\title_1\Blood Run\map_2\furiousheights\title_2\Furious Heights"
//
// Left unset, the server picks three at random from the maps that appear in
// scripts/arenas.txt - installed maps with no arena entry are never offered,
// because a map this server is not configured to rotate to is not one it
// should be sending people to. Set it explicitly for a curated rotation.
//
// g_voteFlags bit 11 (2048) disables end-of-match voting entirely.
set nextmaps            ""

// How long the arena vote stays open, in seconds (clamped 10..120). The server
// publishes the deadline to every client, so the countdown on the match summary
// and the moment the server acts are the same instant. Once every human on the
// server has voted the window is pulled in to 10 seconds - enough to change your
// mind, not enough to sit through the whole clock - and the winner is announced
// before the map loads.
set g_endMapVoteTime    "30"

// Seconds from the start of a round during which a suicide or a world death -
// a telefrag on a crowded spawn, a fall taken before you have a weapon in hand -
// costs neither a point nor a death on the record. A genuine frag still scores
// for the killer; this only stops the opening scramble being held against the
// player it happened to. 0 disables.
set g_matchStartGrace   "10"

// ---------------------------------------------------------------------------
// Network: tick rate and the per-client rate clamp
// ---------------------------------------------------------------------------
//
// Stock values, reset here so net_test.cfg can be switched on and off like any
// other mode config rather than sticking until a restart.
//
// sv_fps is the server tick. 1000/sv_fps is integer, so only some values are
// honest: 40 gives 25ms exactly, 50 gives 20ms exactly, 60 gives 16ms (62.5Hz,
// not 60) and 66 gives 15ms (66.67Hz).
set sv_fps              "40"

// sv_minRate raises every client's effective rate to at least this, whatever
// they set - including a client that sends no rate at all, which lands on 8000
// and receives six snapshots a second. 0 leaves each client on its own value.
//
// SV_RateMsec allows a client (message + 28) * 1000 / rate milliseconds between
// snapshots, so at 64 players and the 1308-byte peak measured on thunderstruck a
// rate of 25000 delivers 18.9 a second against a tick of 40. The wire, not the
// tick, is what has been limiting delivery.
set sv_minRate          "0"

// A ceiling on the same. 0 for none, which is right - a client that has set a
// high rate itself should keep it.
set sv_maxRate          "0"
