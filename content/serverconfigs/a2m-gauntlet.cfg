// a2m-gauntlet.cfg - gauntlets only, instagib. No ranged weapon at all: get
// close or die, and one connect is all it takes.
//   quakelive_dedicated +set dedicated 2 +exec a2m-gauntlet.cfg +map <map>
exec a2m-common.cfg

set sv_hostname         "A2M | Gauntlets Only"
set g_gametype          "0"
set g_startingWeapons   "1"     // gauntlet only
set g_disableLoadout    "32764"    // every weapon except it
set fraglimit           "30"
set timelimit           "15"
// 64, the engine ceiling. sv_maxclients is latched, so this needs a map change
// rather than a map_restart to take effect.
//
// Not every map can hold it. thunderstruck has five info_player_deathmatch and
// no team pads; citycrossings has two, with the rest under team_CTF_redspawn.
// The spawn selector widens to the team pads and takes the least recently used
// point when everything is occupied, so the telefrag chain cannot form - but on
// a map with five points and sixty-four players somebody is still appearing on
// somebody. The server says which maps are in that position at load:
//
//   Spawn points: N info_player_deathmatch + M held in reserve ...
//   Spawns: N so far found no free point - all M usable points were occupied
//
// and the count is repeated in the end of map report. If a map in the rotation
// reports single digits, it wants a lower cap or dropping.
set sv_maxclients       "64"

// Chasing someone down with a melee weapon is the whole game mode, so make it
// less of a slog. Raise g_speed too if it still feels slow.
set g_gauntletSpeedFactor   "1.3"
