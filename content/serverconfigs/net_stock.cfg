// net_stock.cfg - put the network settings back where they were
//
//   exec net_stock.cfg
//   map_restart
//
// The map_restart is not optional, for the same reason it is not optional in
// net_test.cfg: sv_fps only reaches an already-connected client through
// SV_UserinfoChanged.
//
// These are the same three values common.cfg resets to, so exec'ing any mode
// config also undoes net_test.cfg. This file exists for undoing it without
// changing mode.

set sv_fps              "40"
set sv_minRate          "0"
set sv_maxRate          "0"
