// a2m-common.cfg - shared A2M settings, exec'd by each A2M config.
//
// Instagib here means all of it: one weapon, one shot, and no way to get hold
// of anything else. Three separate levers have to agree, because each one
// closes a different route to a second weapon:
//
//   g_instaGib 1        one shot kills, and all ammo becomes infinite
//   g_startingWeapons   the only weapon you spawn with
//   g_disableLoadout    weapons removed from loadout selection
//   g_spawnItemWeapons  no weapon pickups in the map at all
//
// Note the trailing 's' on g_spawnItemWeapons. The gamerule table also lists a
// "g_spawnItemWeapon" without it, which matches no cvar and does nothing - the
// binary has the same typo and it is kept only to mirror it. Setting the
// singular is a silent no-op.
//
// The bitmasks are indexed differently from each other, which is a trap:
//
//   g_startingWeapons   bit (1 << (weapon - 1))    gauntlet 1, railgun 64
//   g_disableLoadout    bit (1 << weapon)          gauntlet 2, railgun 128
//
// Every weapon disabled is 32766 (weapons 1-14); subtract the one you want to
// keep. 32766 - 128 = 32638 keeps the railgun. 32766 - 2 = 32764 keeps the
// gauntlet.
exec common.cfg

set g_instaGib          "1"

// Nothing to pick up: no weapons, no ammo, no armour, no health, no powerups.
// A powerup is meaningless when every hit already kills, and quad on top of
// instagib is just noise.
set g_spawnItemWeapons  "0"
set g_spawnItemAmmo     "0"
set g_spawnItemArmor    "0"
set g_spawnItemHealth   "0"
set g_spawnItemPowerup  "0"
set g_spawnItemHoldable "0"

set g_startingHealth        "100"
set g_startingHealthBonus   "0"
set g_startingArmor         "0"

// Loadout selection off entirely - there is only one weapon to choose.
set g_loadout           "0"
