// a2m-common.cfg - shared A2M settings, exec'd by each A2M config.
//
// Instagib here means both halves of it:
//
//   g_instaGib 1        one shot kills, and every weapon carries infinite ammo
//   g_startingWeapons   which weapon you actually get
//
// g_startingWeapons is a bitmask over weapon numbers, bit (1 << (weapon - 1)):
//
//   gauntlet   1   ->  1        rocket    5  ->  16
//   machinegun 2   ->  2        lightning 6  ->  32
//   shotgun    3   ->  4        railgun   7  ->  64
//   grenade    4   ->  8        plasma    8  -> 128
//
// So 64 is railgun and nothing else; 1 is gauntlet and nothing else. Add them
// to combine (65 would be gauntlet + railgun).
exec common.cfg

set g_instaGib          "1"

// Nothing to pick up when everyone already has the only weapon that matters.
set g_spawnItemWeapon   "0"
set g_spawnItemAmmo     "0"
set g_spawnItemArmor    "0"
set g_spawnItemHealth   "0"

set g_startingHealth        "100"
set g_startingHealthBonus   "0"
set g_startingArmor         "0"
