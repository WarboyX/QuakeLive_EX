// a2m-common.cfg - shared A2M settings, exec'd by each A2M config.
//
// Instagib here means all of it: one weapon, one shot, and no way to get hold
// of anything else. Two levers do the actual work, and they are indexed
// differently from each other, which is a trap:
//
//   g_startingWeapons   the only weapon you spawn with
//                       bit (1 << (weapon - 1))    gauntlet 1, railgun 64
//   g_spawnItemWeapons  no weapon pickups anywhere in the map
//
// Note the trailing 's' on g_spawnItemWeapons. The gamerule table also lists a
// "g_spawnItemWeapon" without it, mirroring the same typo in the binary; it
// matches no cvar and setting it is a silent no-op.
//
// g_loadout 0 turns loadout selection off, so there is no menu to pick a
// different weapon from. g_disableLoadout below is belt-and-braces only - it
// is read exclusively inside the g_loadout branch, so with loadout off it does
// nothing, and it is set purely so that turning loadout back on cannot quietly
// reopen the arsenal. Its bit layout is (1 << weapon), one off from
// g_startingWeapons: gauntlet 2, railgun 128. Every weapon is 32766 (1-14);
// subtract the one to keep - 32766 - 128 = 32638 keeps the railgun,
// 32766 - 2 = 32764 keeps the gauntlet.
//
// A map's worldspawn can overwrite g_disableLoadout, but only when g_loadout
// is on, which is another reason to leave it off.
exec common.cfg

set g_instaGib          "1"

// Nothing to pick up: no weapons, no ammo, no armour, no health, no powerups.
// A powerup is meaningless when every hit already kills, and quad on top of
// instagib is just noise.
set g_spawnItemWeapons  "0"
set g_spawnItemAmmo     "0"
set g_spawnItemArmor    "0"
set g_spawnItemHealth   "0"
set g_spawnItemPowerup  "0"
set g_spawnItemHoldable "0"

set g_startingHealth        "100"
set g_startingHealthBonus   "0"
set g_startingArmor         "0"

// Loadout selection off entirely - there is only one weapon to choose.
set g_loadout           "0"
