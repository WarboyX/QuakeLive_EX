// duel.cfg - one on one, everyone else queues.
//   quakelive_dedicated +set dedicated 2 +exec duel.cfg +map <map>
//
// g_autoJoin does not bypass the queue: the first two players in are the two
// playing, and a third waits rather than barging into a running match.
exec common.cfg

set sv_hostname     "ioquakelive | Duel"
set g_gametype      "1"
set fraglimit       "0"
set timelimit       "10"
set sv_maxclients   "8"
set bot_enable      "0"
