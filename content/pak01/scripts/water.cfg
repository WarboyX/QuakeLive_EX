// [QL] R19: per-map water settings for the reflection pass.
//
// A still pool in a dojo and a channel running under a bridge want different
// numbers, and one global set of cvars cannot be right for both.
//
// THE RULE, and it is the only thing here worth memorising:
//
//   a value below applies only where the player has left that cvar at its
//   shipped default.
//
// Set r_waterWaveHeight yourself and your value wins on every map from then on;
// set it back to the default and the maps take over again. Nothing here is ever
// written into a cvar, so nothing from this file reaches anyone's config.
//
// Keys, all optional - a map that only wants choppier water says only that and
// inherits the rest:
//
//   map         the bare map name, or "default" for everything not named
//   scale       world units from one wave crest to the next. A player is ~56
//               units wide. Small is choppy, large is a slow swell
//   speed       how fast they travel. 0 freezes them
//   steepness   the largest slope the surface tilts to, as rise over run.
//               0.08 is a little under five degrees. The strongest control by
//               a distance; past ~0.2 the reflection reads as noise
//   height      how far the surface actually rises and falls, in world units.
//               Keep it small against `scale` - the two are solved against each
//               other and a height near the wavelength stops converging
//   strength    how much of the reflection survives, 0 to 1
//
// The five above are the WIND CHOP - always present, the same everywhere on the
// surface. The four below are IMPACTS - what a rocket, a shotgun pellet or a
// footfall does. They are separate systems and neither one's keys affect the
// other, which is worth saying because "the water is too calm" and "the
// splashes are too small" have no setting in common.
//
//   ripplesize    how far an impact's rings spread, as a MULTIPLE of what the
//                 weapon asked for. 2 is twice as far. A multiplier and not a
//                 size, so a rocket stays bigger than a pellet
//   rippleheight  how hard an impact hits, as a multiple of the weapon's own
//                 strength. 0 keeps the chop and removes every splash. Foam
//                 follows this, since foam is driven off disturbance
//   ripplewaves   how many rings trail the leading edge - the frequency. Low
//                 is a few fat rings, high is a fine dense pattern. Counted
//                 across the whole reach, so rings keep their shape when
//                 `ripplesize` changes. Past ~12 they shimmer rather than read
//   ripplelife    seconds from impact to gone. The leading edge reaches full
//                 spread exactly at the end of its life, so this sets how fast
//                 the rings travel as well as how long they last
//
// An unknown key is a warning in the console rather than silence, because a
// typo that does nothing and says nothing is the worst outcome available.

{
	map         default
	scale       96
	speed       1.0
	steepness   0.08
	height      2
	strength    1.0
}

// Indoor pools: small, enclosed, sheltered from any wind. Short wavelength
// because the pool is only a few hundred units across and one crest across the
// whole thing reads as a tilting sheet rather than as water.
{
	map         japanesecastles
	scale       64
	speed       0.7
	steepness   0.06
	height      1.5
}

// Wide open water with a lot of sky above it - more room for a longer swell,
// and the reflection is mostly sky, which tolerates a steeper surface before it
// starts to look noisy.
{
	map         campgrounds
	scale       160
	speed       1.1
	steepness   0.10
	height      3
}

{
	map         theedge
	scale       128
	speed       0.9
	steepness   0.09
	height      2.5
}
