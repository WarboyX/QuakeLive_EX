// advanced.cfg - exec advanced.cfg
//
// [QL] E126. What "yes" to "enable advanced rendering?" turns on, for a GPU
// the launch probe found ray-query support on (code/sdl/sdl_vkprobe.c). Vulkan
// renderer only; apply with vid_restart. Every one of these is on the render
// pages - Lighting & Ray Tracing and Water - to change or turn back off.
//
// r_rt is the device switch (latched: builds the world acceleration structure
// at map load); r_rtao is what it is for. Water reflections are screen space
// and cost nothing where there is no water on screen. The splash defaults are
// already the tuned ones (E124), so nothing to set for those.
seta r_rt "1"
seta r_rtao "1"
seta r_ssr "1"
seta r_waterWaves "1"
