// gloss.cfg - exec gloss.cfg
//
// Real environment reflections on world surfaces, using machinery that is
// already in this renderer and switched off by default.
//
// Note this pulls the OPPOSITE way to classic.cfg. Quake 3's metallic look was
// "tcGen environment" - a cheap trick that smears a fixed sky image across a
// surface based on which way it faces. It is not reflection; it does not know
// what is actually around it. What this file turns on is the real thing:
// cubemap probes sampled per surface. It will look glossier than Quake 3 ever
// did, not more like it. Pick whichever you actually want - they do not stack.
//
// No map authoring needed. The renderer looks for an env.json, then for
// misc_cubemap entities, and failing both it uses the map's
// info_player_deathmatch spawn points as probes - so this works on any
// deathmatch map as-is.

echo "^3gloss.cfg^7: enabling cubemap reflections"

set r_cubeMapping 1
set r_cubemapSize 128       // raise to 256 for sharper reflections, costs memory
set r_specularMapping 1     // cubemaps are sampled through the specular path
set r_normalMapping 1       // gives the reflection something to vary against

// Tonemapping compresses highlights, which is most of what flattens metal.
// Leave the rest of the post chain alone so bright reflections stay bright.
set r_toneMap 0
set r_hdr 1                 // cubemap path wants the float framebuffer

vid_restart

echo "^3gloss.cfg^7: done. Needs OpenGL 3.0 - the renderer will say so and"
echo "         switch r_cubeMapping back off if the driver is older."
echo "         'exec classic.cfg' for the authentic Quake 3 look instead."
