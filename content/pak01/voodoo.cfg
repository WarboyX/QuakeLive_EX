// voodoo.cfg - exec voodoo.cfg
//
// The part of the look that genuinely was the 3dfx hardware.
//
// Voodoo cards rendered at 16-bit colour and dithered, and later chips ran a
// postfilter over the result (the "22-bit" mode) that blended the dither
// pattern into something smoother than plain 16-bit. That soft, slightly glowy
// image is what people remember as the Glide look - it was a colour-depth
// artefact, not extra shading.
//
// This gets the dither. There is no postfilter to reproduce it being smoothed
// out afterwards, so expect it to read as grainier than a Voodoo3 did,
// especially on large gradients like skies and coloured lighting.
//
// Applies classic.cfg first, so exec this one on its own.

exec classic.cfg

echo "^3voodoo.cfg^7: dropping to 16-bit colour"

set r_colorbits 16
// At 16-bit the quantisation step is eight times coarser, and the dither
// amplitude tracks the framebuffer the driver actually gave us - so this is
// where it does the most work. It is the same thing the Voodoo hardware did
// before its postfilter ran.
set r_dither 2
set r_texturebits 16
set r_depthbits 16
set r_stencilbits 0

vid_restart

echo "^3voodoo.cfg^7: done. 'exec modern.cfg' to undo."

// [QL] Anisotropic filtering, restored explicitly.
// classic.cfg turns it off on purpose, and a preset that leaves a setting
// behind is a one-way door: r_ext_texture_filter_anisotropic is archived, so
// once CLASSIC had written 0 nothing here brought it back and the render menu
// showed a working anisotropy control that could not take effect.
set r_ext_texture_filter_anisotropic 1
set r_ext_max_anisotropy 4
