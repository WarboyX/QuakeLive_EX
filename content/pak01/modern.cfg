// modern.cfg - exec modern.cfg
//
// Undoes classic.cfg and voodoo.cfg, returning renderergl2 to its own
// defaults. Values here are the defaults from tr_init.c, not guesses.

echo "^3modern.cfg^7: restoring renderergl2 defaults"

set r_hdr 1
set r_toneMap 1
set r_postProcess 1

set r_normalMapping 1
set r_specularMapping 1
set r_deluxeMapping 1
set r_cubeMapping 0

set r_overBrightBits 1
set r_mapOverBrightBits 2
set r_intensity 1

set r_picmip 1
set r_textureMode GL_LINEAR_MIPMAP_LINEAR
set r_subdivisions 4

set r_colorbits 0
set r_texturebits 0
set r_depthbits 0

vid_restart

echo "^3modern.cfg^7: done."
