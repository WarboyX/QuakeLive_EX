// classic.cfg - exec classic.cfg
//
// Pulls renderergl2 back toward the way Quake 3 rendered.
//
// The reflective metal in Quake 3 is "tcGen environment" in the shader
// scripts - spherical environment-map coordinates generated from the vertex
// normal and the view vector. It is renderer logic, not a Glide feature, and
// it is fully implemented here (TCGEN_ENVIRONMENT_MAPPED). What made surfaces
// look flat was never the env mapping going missing; it is that this renderer
// tonemaps, and tonemapping compresses exactly the highlights that read as
// "shiny".
//
// So this turns off everything renderergl2 does that Quake 3 did not do, and
// leaves the rest alone.

echo "^3classic.cfg^7: restoring the Quake 3 render path"

// --- the ones that actually cost you the highlights ------------------------
set r_hdr 0                 // no float framebuffer
set r_toneMap 0             // no highlight compression - this is the big one
set r_postProcess 0         // no post pass at all

// --- renderergl2 additions Quake 3 never had -------------------------------
set r_normalMapping 0
set r_specularMapping 0
set r_deluxeMapping 0
set r_cubeMapping 0

// --- classic light scaling -------------------------------------------------
set r_overBrightBits 1
set r_mapOverBrightBits 2
set r_intensity 1

// --- classic texture handling ----------------------------------------------
set r_picmip 0                              // full resolution
set r_textureMode GL_LINEAR_MIPMAP_LINEAR   // trilinear, as Quake 3 shipped
set r_ext_texture_filter_anisotropic 0      // Quake 3 had no anisotropic filter
set r_ext_max_anisotropy 1                  // and this is what makes the line above visible
set r_subdivisions 4                        // curve tessellation, Quake 3 default

// Output dither. Quake 3 had none, but the banding it removes is an artefact of
// this renderer quantising a float frame, not something Quake 3 ever showed - so
// leaving it on is closer to the original, not further from it. r_dither 0 if
// you disagree.
set r_dither 2

// Several of these are latched, so the change only lands on a restart.
vid_restart

echo "^3classic.cfg^7: done. 'exec voodoo.cfg' for the 16-bit 3dfx look, 'exec modern.cfg' to undo."
