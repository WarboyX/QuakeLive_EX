// autoexec.cfg - Quake Live Ex
//
// This ships with the build and runs on every start. It exists so a test run
// produces a usable log without anyone having to remember what to type first,
// which is the state the useful settings were in until now: known, written
// down somewhere, and absent from the log that needed them.
//
// EDITING: this file is yours. The next release archive contains its own copy,
// so if you extract a new build over the top of an old one your changes go with
// it - keep anything you care about somewhere else and exec it from the bottom
// of this file.
//
// TURNING IT OFF: delete the file, or empty it. Nothing here is required to
// play; every setting is about what ends up in the log.

// ---------------------------------------------------------------------------
// Logging
// ---------------------------------------------------------------------------

// 2 = a file per run, baseq3/qconsole-YYYYMMDD-HHMMSS.log in fs_homepath
//     (%APPDATA%\quakelive\baseq3 on Windows).
// 1 = append to one qconsole.log forever.
// 0 = replace qconsole.log each run, which is the old behaviour and throws away
//     the log of the run that just crashed at the moment you relaunch to
//     reproduce the crash.
// One file per run is the right default for testing: runs stay apart and no
// single file grows without bound. It does leave one file per launch.
seta logfile_keep 2

// Note there is deliberately no "logfile" here. On this build either cvar
// starts the log, and the flush decision is "buffer only if logfile is exactly
// 1" - so logfile_keep on its own already gives an unbuffered log that survives
// a crash. Setting logfile 2 as well changes nothing and only implies both are
// needed.

// Developer prints. This is what makes failed asset registrations, menu parse
// errors and the renderer's own diagnostics visible; several of them are
// PRINT_DEVELOPER and invisible without it. It is already the default on this
// branch and is set here so the log says so rather than leaving it implied.
seta developer 1

// ---------------------------------------------------------------------------
// Automatic reports
// ---------------------------------------------------------------------------

// Write the map report at every map change: snapshot peak and composition,
// anything dropped, delivery limits, how many spawns had to take an occupied
// point, and what every bot was doing when the map ended.
//
// This is the setting that means a log is worth reading afterwards. Without it
// the numbers exist only if somebody typed "snapstats" or "bots" while the
// match was still running, which is never the moment you know you will want
// them.
seta sv_mapEndReport 1

// A rolling snapshot line every 60 seconds: window peak and composition, the
// largest message, how many were sent, how many the client rate clamp held
// back, how many entities were dropped - then the window resets.
//
// snapstats and the map report answer "how bad did it get on this map". This
// answers "how bad is it right now, and is that changing", which is a different
// question. It is also the only way to place a spike in time, because the log
// carries no timestamps: a line every minute is what lets a jump be read next
// to whatever else was being printed around it.
//
// 0 turns it off. Raise it if a line a minute is too much.
seta sv_snapStatsInterval 60

// Bot decisions: every posture change, every defensive posting, and in CTF the
// role each bot picks with the wanted-versus-have counts behind it.
//
// On change rather than on refresh - the tactical picture is recomputed four or
// five times a second and printing it each time was two hundred lines a second
// at sixty bots. A posture change is rare enough to read, and the CTF role line
// only appears when a bot actually re-decides its job.
//
// Still the noisiest thing in this file. Set it to 0 if a log gets unwieldy.
seta bot_debugTactics 1

// ---------------------------------------------------------------------------
// Off by default - turn on only while chasing the matching problem
// ---------------------------------------------------------------------------

// Every warmup state transition, and which gate is blocking a match that will
// not start.
seta g_debugWarmup 0

// ---------------------------------------------------------------------------
// Note on coverage
// ---------------------------------------------------------------------------
//
// This file runs after the filesystem is up, so the log starts here and the
// first few lines of engine startup are not in it. That is fine for almost
// everything. If you need those lines - a filesystem or renderer problem
// before the game loads - put the settings on the command line instead, where
// they apply before anything is printed:
//
//   quakelive.x86_64.exe +set logfile_keep 2 +set logfile 2
//
// ---------------------------------------------------------------------------
// Not here: the network experiment
// ---------------------------------------------------------------------------
//
// sv_fps, sv_minRate and sv_maxRate live in baseq3/net_test.cfg, not in this
// file, for two reasons.
//
// This file ships to everyone and runs on every start, and a tick rate change
// is not a diagnostic - it changes how the server feels, what it costs in CPU
// and how much upstream it needs. A default nobody chose is the wrong shape for
// that.
//
//   exec net_test.cfg          to try 50 tick and an unclamped rate
//   exec net_stock.cfg         to go back
//
// Both take effect on the next frame. They used to need a map_restart behind
// them, because sv_fps only reached a client through SV_UserinfoChanged; the
// snapshot interval is derived per frame now, so that is no longer true.
//
// Exec'ing any mode config also puts them back, because common.cfg resets all
// three.

// Anything of your own goes below here.
