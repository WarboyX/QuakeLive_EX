name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev \
          libfreetype-dev libogg-dev libvorbis-dev
    - name: Compile
      run: make release -j$(nproc)
    - name: Stage build outputs
      run: |
        mkdir -p staging/libs staging/engine
        cp build/release-linux-x86_64/baseq3/cgamex86_64.so  staging/libs/
        cp build/release-linux-x86_64/baseq3/qagamex86_64.so staging/libs/
        cp build/release-linux-x86_64/baseq3/uix86_64.so     staging/libs/
        # actions/upload-artifact strips +x; tar to preserve mode bits.
        tar -C build/release-linux-x86_64 -cf staging/engine/linux-x86_64.tar \
          quakelive.x86_64 quakelive_dedicated.x86_64 opengl2x86_64.so
    - uses: actions/upload-artifact@v4
      with:
        name: libs-linux-x86_64
        path: staging/libs/
    - uses: actions/upload-artifact@v4
      with:
        name: engine-linux-x86_64
        path: staging/engine/

  macos-compile:
    name: macOS (compile + sign dylibs)
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: brew install sdl2 freetype libogg libvorbis
    - name: Compile
      run: make release USE_LOCAL_HEADERS=0 ARCH=arm64 -j$(sysctl -n hw.logicalcpu)
    - name: Import signing certificate
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KC_PWD:   ${{ secrets.MACOS_KEYCHAIN_PWD }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "$CERT_B64" | base64 -d > cert.p12
        security create-keychain -p "$KC_PWD" build.keychain
        security default-keychain -s build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        security unlock-keychain -p "$KC_PWD" build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security import cert.p12 -k build.keychain -P "$CERT_PWD" \
          -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KC_PWD" build.keychain >/dev/null
        rm cert.p12
        IDENTITIES="$(security find-identity -v -p codesigning)"
        echo "Available codesigning identities:"
        echo "$IDENTITIES"
        IDENTITY="$(echo "$IDENTITIES" \
          | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' \
          | head -1)"
        if [ -z "$IDENTITY" ]; then
          echo "ERROR: no Developer ID Application identity found in keychain search list" >&2
          exit 1
        fi
        echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

    - name: Sign game dylibs
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        # Sign here (not in macos-bundle) so the signed bytes are baked into
        # the libs-macos-arm64 artifact. The downstream universal iobin.pk3
        # is built from those bytes; signatures embed in Mach-O and survive
        # the pk3 round-trip.
        for dylib in build/release-darwin-arm64/baseq3/cgamearm64.dylib \
                     build/release-darwin-arm64/baseq3/qagamearm64.dylib \
                     build/release-darwin-arm64/baseq3/uiarm64.dylib; do
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" "$dylib"
          codesign --verify --strict --verbose=2 "$dylib"
        done

    - name: Stage build outputs
      run: |
        mkdir -p staging/libs staging/engine-raw
        cp build/release-darwin-arm64/baseq3/cgamearm64.dylib  staging/libs/
        cp build/release-darwin-arm64/baseq3/qagamearm64.dylib staging/libs/
        cp build/release-darwin-arm64/baseq3/uiarm64.dylib     staging/libs/
        # Tar the raw engine binaries to preserve +x. These are unsigned;
        # macos-bundle codesigns them after they're placed inside the .app.
        tar -C build/release-darwin-arm64 -cf staging/engine-raw/raw-macos-engine.tar \
          quakelive.arm64 quakelive_dedicated.arm64 opengl2arm64.dylib
    - uses: actions/upload-artifact@v4
      with:
        name: libs-macos-arm64
        path: staging/libs/
    - uses: actions/upload-artifact@v4
      with:
        name: raw-macos-engine
        path: staging/engine-raw/

  macos-bundle:
    name: macOS (bundle + notarise)
    needs: [linux, windows, macos-compile]
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install Dependencies
      # Needed by make-macosx-app.sh's Homebrew dylib bundling step (otool /
      # install_name_tool walk against the actual brew-installed dylibs).
      run: brew install sdl2 freetype libogg libvorbis
    - name: Download game library artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: libs-*
        path: iobin-stage
        merge-multiple: true
    - name: Build universal iobin.pk3
      run: |
        mkdir -p shared/baseq3
        python3 code/tools/make_deterministic_pk3.py \
          --input iobin-stage \
          --output shared/baseq3/iobin.pk3
        shasum -a 256 shared/baseq3/iobin.pk3
    - uses: actions/upload-artifact@v4
      with:
        name: iobin-pk3
        path: shared/baseq3/iobin.pk3
    - name: Build deterministic pak01.pk3
      run: |
        python3 code/tools/make_deterministic_pk3.py \
          --input content/pak01 \
          --output shared/baseq3/pak01.pk3
        shasum -a 256 shared/baseq3/pak01.pk3
    - uses: actions/upload-artifact@v4
      with:
        name: pak01-pk3
        path: shared/baseq3/pak01.pk3
    - name: Download raw macOS engine binaries
      uses: actions/download-artifact@v4
      with:
        name: raw-macos-engine
        path: raw-macos-engine
    - name: Unpack raw engine binaries into build tree
      run: |
        mkdir -p build/release-darwin-arm64/baseq3
        tar -xf raw-macos-engine/raw-macos-engine.tar -C build/release-darwin-arm64
        # make-macosx-app.sh picks up pak01.pk3 from this path automatically.
        cp shared/baseq3/pak01.pk3 build/release-darwin-arm64/baseq3/pak01.pk3
        ls -l build/release-darwin-arm64/
    - name: Import signing certificate
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KC_PWD:   ${{ secrets.MACOS_KEYCHAIN_PWD }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "$CERT_B64" | base64 -d > cert.p12
        security create-keychain -p "$KC_PWD" build.keychain
        security default-keychain -s build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        security unlock-keychain -p "$KC_PWD" build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security import cert.p12 -k build.keychain -P "$CERT_PWD" \
          -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KC_PWD" build.keychain >/dev/null
        rm cert.p12
        IDENTITIES="$(security find-identity -v -p codesigning)"
        echo "Available codesigning identities:"
        echo "$IDENTITIES"
        IDENTITY="$(echo "$IDENTITIES" \
          | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' \
          | head -1)"
        if [ -z "$IDENTITY" ]; then
          echo "ERROR: no Developer ID Application identity found in keychain search list" >&2
          exit 1
        fi
        echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

    - name: Create App Bundle
      env:
        # Tell make-macosx-app.sh to use the universal iobin.pk3 we just built
        # (containing signed macOS dylibs + Linux .so + Windows .dll) instead
        # of building a macOS-only one from local dylibs.
        PREBUILT_IOBIN_PK3: ${{ github.workspace }}/shared/baseq3/iobin.pk3
      run: |
        chmod +x make-macosx-app.sh
        ./make-macosx-app.sh release arm64

    - name: Verify bundled pk3s
      # Hard-fail if the .app is missing iobin.pk3 / pak01.pk3 in
      # Contents/Resources/baseq3/. Without these the engine boots into
      # "VM_Create: failed to extract game module 'ui'" at runtime, but the
      # rest of the pipeline (codesign, notarisation) will happily accept a
      # signed-but-broken bundle. Catch it here so a bad build can never
      # reach the release artifact.
      run: |
        set -euo pipefail
        APP=build/release-darwin-arm64/quakelive.app
        BASE="$APP/Contents/Resources/baseq3"
        echo "Listing $BASE:"
        ls -la "$BASE" || { echo "ERROR: $BASE does not exist" >&2; exit 1; }
        missing=0
        for pk3 in iobin.pk3 pak01.pk3; do
          if [ ! -f "$BASE/$pk3" ]; then
            echo "ERROR: $BASE/$pk3 is missing from the .app bundle" >&2
            missing=1
          fi
        done
        [ "$missing" -eq 0 ] || exit 1
        shasum -a 256 "$BASE/iobin.pk3" "$BASE/pak01.pk3"

    - name: Codesign app bundle
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "Signing with: $IDENTITY"

        # Walk bundle contents bottom-up. --deep is unreliable with embedded
        # frameworks. quakelive_dedicated must be signed individually -
        # bundle signing only touches CFBundleExecutable. The game dylibs
        # inside iobin.pk3 were already signed in macos-compile.
        APP=build/release-darwin-arm64/quakelive.app

        # Sign nested dylibs/sos first.
        find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 \
          | while IFS= read -r -d '' lib; do
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "$lib"
            done

        # Sign non-main executables in Contents/MacOS/ (use `file` to detect
        # Mach-O since extensionless binaries have no reliable name pattern).
        find "$APP/Contents/MacOS" -type f -print0 \
          | while IFS= read -r -d '' bin; do
              if file "$bin" | grep -q 'Mach-O'; then
                codesign --force --options runtime --timestamp \
                  --sign "$IDENTITY" "$bin"
              fi
            done

        # Finally, sign the bundle itself.
        codesign --force --options runtime --timestamp \
          --sign "$IDENTITY" "$APP"
        codesign --verify --strict --verbose=2 "$APP"

    - name: Notarise and staple
      env:
        CERT_B64:   ${{ secrets.MACOS_CERTIFICATE_P12 }}
        KEY_ID:     ${{ secrets.MACOS_NOTARY_KEY_ID }}
        KEY_ISSUER: ${{ secrets.MACOS_NOTARY_KEY_ISSUER }}
        KEY_P8:     ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "$KEY_P8" | base64 -d > AuthKey.p8
        APP=build/release-darwin-arm64/quakelive.app
        # ditto preserves the bundle correctly inside the submission zip.
        ditto -c -k --keepParent "$APP" quakelive-notarise.zip

        # notarytool submit --wait returns 0 even when status is Invalid,
        # so we have to parse the output and react ourselves.
        SUBMIT_OUT="$(xcrun notarytool submit quakelive-notarise.zip \
          --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$KEY_ISSUER" \
          --wait 2>&1 | tee /dev/stderr)"
        SUBMIT_ID="$(echo "$SUBMIT_OUT" | awk '/^  id:/ {print $2; exit}')"
        STATUS="$(echo "$SUBMIT_OUT" | awk '/^  status:/ {print $2; exit}')"
        echo "submission id: $SUBMIT_ID"
        echo "status:        $STATUS"

        if [ -n "$SUBMIT_ID" ]; then
          echo "----- notarisation log -----"
          xcrun notarytool log "$SUBMIT_ID" \
            --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$KEY_ISSUER" || true
          echo "----- end notarisation log -----"
        fi

        rm -f AuthKey.p8 quakelive-notarise.zip

        if [ "$STATUS" != "Accepted" ]; then
          echo "ERROR: notarisation status was '$STATUS', expected 'Accepted'" >&2
          exit 1
        fi

        # Staple the ticket to the on-disk .app so Gatekeeper can verify offline.
        xcrun stapler staple "$APP"
        xcrun stapler validate "$APP"

    - name: Stage final app bundle
      run: |
        set -euo pipefail
        mkdir -p staging/engine
        # actions/upload-artifact strips POSIX permissions and breaks
        # bundle symlinks, so tar the .app to preserve everything.
        tar -C build/release-darwin-arm64 -cf staging/engine/quakelive.app.tar quakelive.app
        # Re-verify pk3s survived signing/notarisation/stapling. If something
        # along the way silently dropped them, fail before the artifact is
        # uploaded so we can never ship a broken release.
        BASE="quakelive.app/Contents/Resources/baseq3"
        for pk3 in iobin.pk3 pak01.pk3; do
          if ! tar -tf staging/engine/quakelive.app.tar "$BASE/$pk3" >/dev/null 2>&1; then
            echo "ERROR: $BASE/$pk3 missing from staged quakelive.app.tar" >&2
            exit 1
          fi
        done
        tar -xOf staging/engine/quakelive.app.tar "$BASE/iobin.pk3" | shasum -a 256
        tar -xOf staging/engine/quakelive.app.tar "$BASE/pak01.pk3" | shasum -a 256
    - uses: actions/upload-artifact@v4
      with:
        name: engine-macos-arm64
        path: staging/engine/

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install VS 2026 Build Tools (v145)
      shell: pwsh
      run: |
        Write-Host "Installing VS 2026 Build Tools..."
        choco install visualstudio2026buildtools `
          --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --quiet" `
          -y --ignore-package-exit-codes=3010
        Write-Host "VS 2026 Build Tools installation completed"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild misc/msvc/ioquakelive.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /m

    - name: Stage build outputs
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path staging/libs   | Out-Null
        New-Item -ItemType Directory -Force -Path staging/engine | Out-Null
        Copy-Item build/Release/x64/baseq3/cgamex86_64.dll  staging/libs/
        Copy-Item build/Release/x64/baseq3/qagamex86_64.dll staging/libs/
        Copy-Item build/Release/x64/baseq3/uix86_64.dll     staging/libs/
        # Engine binaries plus the runtime DLLs (SDL2, freetype, ...) that
        # ship next to quakelive.exe
        Copy-Item build/Release/x64/*.exe staging/engine/
        Copy-Item build/Release/x64/*.dll staging/engine/
    - uses: actions/upload-artifact@v4
      with:
        name: libs-windows-x64
        path: staging/libs/
    - uses: actions/upload-artifact@v4
      with:
        name: engine-windows-x64
        path: staging/engine/

  package:
    name: Package release artifacts
    needs: [linux, macos-bundle, windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Download engine artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: engine-*
        path: engines
    - name: Unpack tarred engine artifacts
      run: |
        # Linux and macOS engine binaries are tarred to preserve +x and
        # bundle structure (upload-artifact strips POSIX mode bits).
        for tar in engines/engine-linux-x86_64/linux-x86_64.tar \
                   engines/engine-macos-arm64/quakelive.app.tar; do
          if [ -f "$tar" ]; then
            tar -xf "$tar" -C "$(dirname "$tar")"
            rm "$tar"
          fi
        done
        # Sanity-check the executable bit survived.
        ls -l engines/engine-linux-x86_64/quakelive.x86_64
        ls -l engines/engine-macos-arm64/quakelive.app/Contents/MacOS/
    - name: Download universal iobin.pk3
      uses: actions/download-artifact@v4
      with:
        name: iobin-pk3
        path: shared/baseq3/
    - name: Download deterministic pak01.pk3
      uses: actions/download-artifact@v4
      with:
        name: pak01-pk3
        path: shared/baseq3/
    - name: Verify shared artifact hashes
      run: sha256sum shared/baseq3/iobin.pk3 shared/baseq3/pak01.pk3
    - name: Build per-platform release zips
      run: |
        python code/tools/build_release_zips.py \
          --shared shared \
          --engines engines \
          --output build
        ls -la build/
    - uses: actions/upload-artifact@v4
      with:
        name: release-zips
        path: build/quakelive-*.zip

  release:
    name: Create Release
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from commit message
      id: version
      env:
        MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$MSG" | head -1 | sed 's/^release: *//')
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
    - name: Create tag
      run: |
        git tag "${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"
    - uses: actions/download-artifact@v4
      with:
        name: release-zips
        path: artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.version }}
        files: artifacts/*.zip
        generate_release_notes: true
